[package]
name = "brace"
version = "0.1.6"
description = "Brace — a terminal with proxy/agent-aware config and git-aware file browsing"
authors = ["Albert0x"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 伪终端：Windows 下走 ConPTY，跨平台最稳的 pty 方案（wezterm 出品）
portable-pty = "0.8"
# 窗口毛玻璃/亚克力效果（Win11 Mica/Acrylic）
window-vibrancy = "0.5"
# 自动更新
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 用量窗口时间计算（5小时/7天滚动窗口）
chrono = "0.4"
# 进程检测：判断当前终端是否真在跑 claude
sysinfo = "0.33"
# 读注册表判断 Windows 版本（Win10 的 acrylic 有黑边，需区分 Win10/11）
winreg = "0.10"
# 文件预览：图片转 base64 data URI
base64 = "0.22"
# 文件预览：中文 Windows 上大量 .bat/.txt 是 GBK，PowerShell 5.1 输出的是 UTF-16LE，
# 只按 UTF-8 读会全部误判成二进制文件
encoding_rs = "0.8"
chardetng = "1"
# 文件树自动刷新：监听当前目录的文件系统变化。用 debouncer 版本是因为
# 一次 pnpm install 能刷出几千个事件，不防抖会把 IPC 打爆
notify-debouncer-full = "0.7"
# 文件树的删除走回收站，不做永久删除——树上手一抖点到删除的概率不低
trash = "5"

[target.'cfg(windows)'.dependencies]
# DPAPI：配置组里的 API Key 按当前用户密钥加密后再落盘，配置文件被同步/备份/误分享
# 时 token 不会跟着裸奔。0.61 是依赖树里已有的版本，不额外引入新的 windows-sys
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

