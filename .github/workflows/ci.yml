name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上新的 push 直接取消还在跑的旧任务，别让队列堆着白烧 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows 是目前唯一完整实现的平台，PTY / shell 检测 / DPAPI 都只在这上面有意义
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Rust 编译是这个流水线里最慢的一段，缓存 registry 和 target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --frozen-lockfile：lockfile 对不上就失败，别在 CI 里悄悄改依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build frontend
        run: pnpm build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
